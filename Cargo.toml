[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "bilistream"
version = "0.6.0"
edition = "2021"

[features]
tauri-build = []

[profile.release]
opt-level = "z"   # Optimize for size (also reduces memory usage)
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Better optimization
strip = true      # Strip symbols from binary

[dependencies]
async-trait = "0.1.77"
chrono = "0.4.34"
clap = { version = "4.5.1", features = ["derive", "cargo"] }
clap_complete = "4.5.1"
regex = "1.10.3"
# charset/form/http2/multipart/system-proxy were unconditional in reqwest 0.11;
# 0.13 moved them behind features that `default-features = false` would drop.
# rustls-no-provider rather than rustls: the latter selects aws-lc-rs, which
# needs cmake and nasm to build and whose symbol count broke the mingw link.
# install_crypto_provider() picks the backend at startup instead.
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "cookies",
  "form",
  "http2",
  "json",
  "multipart",
  "rustls-no-provider",
  "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
reqwest-middleware = { version = "0.5", features = ["form"] }
reqwest-retry = "0.9"
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
tokio = { version = "1.36.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "chrono"] }
md-5 = "0.11"
serde_urlencoded = "0.7"
qrcode = "0.14"
textwrap = "0.16"
unicode-width = "0.2"
lazy_static = "1.4.0"
percent-encoding = "2.3.1"
# WebSocket and streaming dependencies for native danmaku client
# rustls-tls-native-roots keeps the OS trust store that native-tls used, and
# reuses the process-wide ring provider from install_crypto_provider().
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
byteorder = "1.5"
flate2 = "1.0"
brotli = "8.0.2"
anyhow = "1.0"
# Web UI dependencies
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = [
  "compression-br",
  "compression-gzip",
  "cors",
  "fs",
  "set-header",
] }
base64 = "0.23"
# Windows dependencies
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# System tray dependencies (platform-specific)
open = "5.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
ksni = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
trayicon = "0.4"
winapi = { version = "0.3", features = [
  "winuser",
  "libloaderapi",
  "consoleapi",
  "processenv",
  "fileapi",
  "winnt",
  "winbase",
] }
