name: Release
# Publishing is tag-driven: pushing the newest tag builds both archives and
# creates the release. workflow_dispatch re-runs the same tag after a failed
# upload. Older tags are refused — only the latest release may be published, so
# a stray tag push cannot rewrite a release that is already out.
#
# The two platforms build in parallel jobs and meet again in `publish`, which
# owns packaging. Staging therefore exists once instead of once per platform,
# and a red run names the platform that broke.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v0.8.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Refuse anything but the latest tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ "$TAG" != "$latest" ]; then
            echo "::error::$TAG is not the latest tag ($latest); only the latest release may be published"
            exit 1
          fi
  # Ubuntu 22.04 keeps both Linux binaries on glibc 2.35. Building on a newer
  # image would silently raise that floor, and the release notes state it.
  linux:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      # The webkit2gtk/gtk packages are what the desktop wrapper links against
      # on Linux; without them `bilistream-tauri` does not build at all.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Build CLI
        run: cargo build --locked -p bilistream --release --bin bilistream
      # The desktop wrapper is a separate workspace package (`src-tauri`). It is
      # built rather than bundled: tauri.conf.json has bundling switched off, so
      # this yields the bare `bilistream-tauri` binary the archive ships.
      - name: Build desktop
        run: cargo build --locked -p bilistream-tauri --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux
          retention-days: 3
          if-no-files-found: error
          path: |
            target/release/bilistream
            target/release/bilistream-tauri
  windows:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build CLI
        run: cargo build --locked -p bilistream --release --target x86_64-pc-windows-gnu
      # Linking this binary prints "corrupt .drectve at end of def file" on the
      # runner's binutils 2.38. The section comes from the LLVM-built
      # WebView2LoaderStatic.lib that webview2-com-sys ships, it only carries
      # MSVC /DEFAULTLIB directives mingw ignores anyway, and the resulting PE
      # imports WebView2Loader.dll dynamically. Harmless; newer binutils drop
      # the message, so it never appears on a local build.
      - name: Build desktop
        run: cargo build --locked -p bilistream-tauri --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows
          retention-days: 3
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-gnu/release/bilistream.exe
            target/x86_64-pc-windows-gnu/release/bilistream-tauri.exe
            # webview2-com-sys places this next to the binary. It is
            # deliberately not tracked in the repository.
            target/x86_64-pc-windows-gnu/release/WebView2Loader.dll
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The notes are generated from the commits between this tag and the
      # previous one, so the whole tag history has to be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
      - name: Package
        run: |
          set -euo pipefail
          root="release/v${TAG#v}"
          stage() {
            local dir=$1
            mkdir -p "$dir/assets/icons" "$dir/webui/mock" "$dir/docs/images"
            cp README.md README.zh_CN.md LICENSE "$dir/"
            cp assets/icons/icon.png assets/icons/icon.svg "$dir/assets/icons/"
            cp -R webui/dist webui/public-dist "$dir/webui/"
            cp webui/mock/*.mjs "$dir/webui/mock/"
            cp docs/index.md docs/first-run.md docs/dependencies.md docs/dependencies.zh_CN.md \
              docs/remote-access.md docs/remote-access.zh_CN.md docs/data-and-upgrades.md \
              docs/data-and-upgrades.zh_CN.md docs/build.md docs/build.zh_CN.md \
              docs/advanced-settings.md docs/advanced-settings.zh_CN.md docs/niconico-session.md \
              docs/public-status.md docs/websub-tunnel.md docs/youtube-discovery.md "$dir/docs/"
            cp docs/images/*.png "$dir/docs/images/"
          }
          stage "${root}/bilistream_linux"
          stage "${root}/bilistream_windows"
          # Artifacts do not carry the executable bit, so restore it before the
          # binaries go into the archive.
          chmod +x bins/bin-linux/bilistream bins/bin-linux/bilistream-tauri
          cp bins/bin-linux/bilistream bins/bin-linux/bilistream-tauri "${root}/bilistream_linux/"
          cp bins/bin-windows/bilistream.exe bins/bin-windows/bilistream-tauri.exe \
            bins/bin-windows/WebView2Loader.dll "${root}/bilistream_windows/"
          tar -czf "${root}/bilistream_linux.tar.gz" -C "$root" bilistream_linux
          (cd "$root" && zip -qr bilistream_windows.zip bilistream_windows)
          rm -rf "${root}/bilistream_linux" "${root}/bilistream_windows"
          (cd "$root" && sha256sum bilistream_linux.tar.gz bilistream_windows.zip > SHA256SUMS)
          ls -lh "$root"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="release/v${TAG#v}"
          assets=("$root"/bilistream_linux.tar.gz "$root"/bilistream_windows.zip "$root"/SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          # Notes come from the commits in this tag, not from a file in the tree.
          start=()
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2> /dev/null || true)
          if [ -n "$previous" ]; then
            start=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" --title "Bilistream ${TAG}" \
            --generate-notes "${start[@]}" "${assets[@]}"
