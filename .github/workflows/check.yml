name: Checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit a tag resolved to on 2026-10-18, so a moved tag
      # cannot change what runs in CI. Bump deliberately (or via Dependabot).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Not pinned: for this action the ref *is* the toolchain selector
      # (`@stable` means "install stable"), so a SHA pin would silently stop
      # selecting one. Pinning it means moving to `toolchain: stable` as an
      # input, which is a deliberate change rather than a drive-by edit.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix webui --ignore-scripts
      - run: npm --prefix webui run check
      - run: npm --prefix webui test
      - run: cargo fmt --all --check
      # `dev` pushes are not covered by a PR gate, and the accumulated clippy
      # debt proved nothing else watched them. Not `-D warnings` yet: the tree
      # still carries ten pre-existing warnings; turn the deny on once they are
      # cleared, so this step cannot regress silently in the meantime.
      - run: cargo clippy --locked -p bilistream --all-targets
      - run: cargo test --locked -p bilistream
      - run: cargo build --locked -p bilistream --bin bilistream
