name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix webui --ignore-scripts
      - run: npm --prefix webui run check
      - run: npm --prefix webui test
      - run: cargo fmt --all --check
      - run: cargo test --locked -p bilistream
      - run: cargo build --locked -p bilistream --bin bilistream
