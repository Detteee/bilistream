name: Checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit a tag resolved to on 2026-10-18, so a moved tag
      # cannot change what runs in CI. Bump deliberately (or via Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately not pinned: for this action the ref *is* the toolchain
      # selector (`@stable` means "install stable"), so a SHA pin would silently
      # stop selecting one. Pinning it means moving to `toolchain: stable` as an
      # input, which is a deliberate change with no current benefit — decided
      # on 2026-10-19 and recorded in the backend quality guidelines.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --prefix webui --ignore-scripts
      - run: npm --prefix webui run check
      - run: npm --prefix webui test
      - run: cargo fmt --all --check
      # `dev` pushes are not covered by a PR gate, and the accumulated clippy
      # debt proved nothing else watched them. `-D warnings` is on since the
      # tree reached zero warnings (`286819be`, re-verified 2026-10-19), so a new
      # warning fails here instead of piling up for the next review.
      - run: cargo clippy --locked -p bilistream --all-targets -- -D warnings
      - run: cargo test --locked -p bilistream
      - run: cargo build --locked -p bilistream --bin bilistream
