[package]
name = "bilistream-tauri"
version = "0.6.2"
edition = "2021"

[lib]
name = "bilistream_tauri"
# Desktop-only: the binary links the rlib. staticlib/cdylib exist for the mobile
# targets, which are not set up here, and the cdylib fails to link for
# x86_64-pc-windows-gnu because mingw auto-exports every symbol and the
# aws-lc-sys + openssl-sys symbol count overflows the PE export ordinal limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-shell = "2"
bilistream = { path = "..", features = ["tauri-build"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
